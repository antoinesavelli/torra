# Runs on every push to main and every PR: the full test suite, mypy, and
# the defensive-coding scorecard with --enforce (fails the build if any
# dimension drops below the floor recorded in
# scripts/dev/defensive_coding_report.py's ENFORCE_FLOORS).
# (A hardcoded test count went stale here once already -- found in a
# full-file audit -- so don't put one back.)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Pinned (requirements-lock.txt), not floating latest -- a
        # transitive dependency's breaking release used to be able to
        # change what CI tests against between one run and the next with
        # no corresponding code change to explain a sudden failure.
        run: |
          pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Run the test suite
        run: python3 -m pytest tests/ -q

      - name: Type check
        run: mypy harness/

      - name: Defensive-coding scorecard
        run: python3 scripts/dev/defensive_coding_report.py --verbose --enforce
