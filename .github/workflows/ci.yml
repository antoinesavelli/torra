# Runs on every push to main and every PR: the 76-case test suite, mypy, and
# the defensive-coding scorecard with --enforce (fails the build if any
# dimension drops below the floor recorded in
# scripts/dev/defensive_coding_report.py's ENFORCE_FLOORS).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio pyyaml textual inotify_simple
          pip install ruff mypy radon coverage
          pip install -e .

      - name: Run the test suite
        run: python3 -m pytest tests/ -q

      - name: Type check
        run: mypy harness/

      - name: Defensive-coding scorecard
        run: python3 scripts/dev/defensive_coding_report.py --verbose --enforce
