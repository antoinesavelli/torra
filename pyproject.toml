# Build, dependency, and tool config for torra package. `[tool.ruff]` and
# `[tool.mypy]` here are what `scripts/dev/defensive_coding_report.py` and CI
# both run against -- see DEFENSIVE_CODING_STANDARDS.md for why these specific
# rules and thresholds.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torra"
# Not maintained -- this is a solo tool with no external consumers of the
# package as an API. `git log`/GitHub's own commit and compare views are the
# record of what changed and when; there is no CHANGELOG.md, no tags, and no
# `torra --version` flag to keep in sync with a number here. Required by the
# packaging spec (PEP 621: `version` is mandatory unless declared `dynamic`),
# so it stays present and fixed.
version = "0.0.0"
description = "A local model proposes operating-system changes; five code-based gates classify them and snapshot what they touch, and the operator ticks every risky step before it runs."
requires-python = ">=3.12"
# Runtime pins are exactly the versions the former requirements-lock.txt held;
# uv.lock pins the transitive set. Raise a pin deliberately, not as a reflex.
dependencies = ["PyYAML==6.0.3", "textual==8.2.8", "python-dotenv==1.2.3"]

[project.optional-dependencies]
fast = ["inotify-simple==2.0.1"]

[project.scripts]
torra = "torra.cli:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff==0.16.3",
    "mypy==2.3.1",
    "pytest-asyncio==1.4.0",
    "coverage==7.15.2",
    "radon==6.0.1",
    "types-pyyaml==6.0.12.20260906",
]

[tool.hatch.build.targets.wheel]
packages = ["torra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes -- undefined names, unused imports
    "I",        # isort -- import ordering
    "B",        # bugbear -- common real bugs, not just style
    "UP",       # pyupgrade -- modernize syntax
    "C4",       # comprehension style
    "TID",      # tidy imports (no relative-import spaghetti)
    "S602", "S604", "S605",  # shell=True and shell-string process starts
    "C90",      # mccabe complexity, ceiling below
]
ignore = [
    "E501",  # line length -- not worth fighting line-by-line, see DEFENSIVE_CODING_STANDARDS.md
]

[tool.ruff.lint.mccabe]
max-complexity = 14

[tool.mypy]
python_version = "3.12"
strict = true
files = ["torra"]
