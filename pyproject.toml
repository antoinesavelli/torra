[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-agent-harness"
version = "7.0.0"
description = "A local model proposes, five gates decide, you approve. Pop-OS terminal agent."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "textual>=0.60"]

[project.optional-dependencies]
fast = ["inotify_simple>=1.3"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
