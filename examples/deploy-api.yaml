# examples/deploy-api.yaml
# A task is a file, not a Python program. `run` is both what executes and what
# the safety classifier sees, so what gets classified is exactly what gets run.

task_id: deploy-api-2026-07-27
request: deploy commit a1b2c3d to staging

watch_roots:
  - /tmp/torra-example

steps:
  - id: prepare
    kind: shell
    run: mkdir -p /tmp/torra-example
    description: ensure the working directory exists
    estimated_seconds: 2

  - id: write-config
    kind: write
    run: printf 'workers = 4\n' > /tmp/torra-example/app.conf
    description: set the worker count
    estimated_seconds: 5
    touches:
      - /tmp/torra-example/app.conf

  - id: verify
    kind: shell
    run: grep -q 'workers = 4' /tmp/torra-example/app.conf
    description: confirm the config landed
    estimated_seconds: 2

# For steps the undo generator honestly reports as uncovered, declare the
# inverse here. Files, services, packages, and mkdir are derived automatically.
rollback: []
