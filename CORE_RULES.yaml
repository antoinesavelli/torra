# CORE_RULES.yaml
#
# NOT LOADED BY ANY CURRENT CODE. `grep -rn CORE_RULES harness/` returns
# nothing -- there is no ModelSelector.from_yaml and no
# phase1_integrated_executor.py in this repo; both belonged to the six-phase
# prototype (`legacy/`) this package was consolidated from and have been
# removed. This file survives as a human-readable snapshot of the harness's
# *default* configuration values, for someone auditing or tuning the system
# without reading Python -- not as a second source of truth.
#
# The real, authoritative values live in the code that actually runs:
#   core_behaviors.*        harness/pipeline.py Harness.__init__ defaults,
#                            harness/gates/{state,rollback,clarifier}.py
#   risk_mitigations.*      harness/core/{conflict,context}.py,
#                            harness/core/ollama.py
#   model_routing.*         harness/gates/router.py (ROUTING_RULES, RULE_WEIGHTS)
#
# Nothing enforces agreement between this file and those defaults, so it can
# and does drift -- e.g. `keep_recent` below says 3, but
# `ContextCompressor.__init__`'s actual default is 4. Treat any number here
# as "roughly what it was when someone last hand-updated this file," not as
# current fact. If you need the routing algorithm's real behavior in
# particular: it is weighted scoring with an earliest-match lead multiplier,
# not the first-match table this file's shape suggests -- first-match routing
# was tried and rejected for mis-routing multi-intent requests, see
# `HANDOFF.md` §3.

core_behaviors:
  safety_first:
    enabled: true
    auto_approve_levels: [safe, caution]
    # Levels above these always require an explicit yes.
  transparency:
    enabled: true
    require_reasoning: true
  verify_state:
    enabled: true
    recheck_between_steps: true    # Phase 2: continuous VERIFY_STATE
    default_ttl_seconds: 10        # per-precondition TTL, 0 = every step
  rollback_on_fail:
    enabled: true
    stop_on_cancel: true
    generate_undos: true           # Phase 3: derive undos from step state
    stop_on_unverified: true       # Phase 3: halt if an undo cannot be proven
    max_shadow_bytes: 67108864     # Phase 3: refuse to snapshot beyond this
  ask_clarifying_questions:
    enabled: true
    min_specific_tokens: 4

risk_mitigations:
  adaptive_checkpointing:
    short_max_minutes: 5
    medium_max_minutes: 30
    medium_target_checkpoints: 5
    min_observations: 3            # Phase 2: steps before revising
    compact_every: 25              # Phase 2: deltas before a new base
    lock_block: false              # Phase 3: wait for a contended task id
    lock_timeout: 0                # Phase 3: max wait when lock_block is true
  conflict_detection:
    algorithm: sha256
    abort_on_conflict: true
    watch_roots: []                # Phase 2: dirs watched in full
    max_files: 50000
  context_compression:
    max_tokens: 32000
    trigger_ratio: 0.90
    target_ratio: 0.45
    keep_recent: 3
  ollama_fallback:
    host: http://localhost:11434
    probe_timeout_seconds: 0.5
    monitor_interval_seconds: 5
    fallback_model: qwen3.5:latest   # OllamaClient's own default; was qwen3:8b until a
                                      # full-file audit found it referenced a deleted model

model_routing:
  # Model catalog pruned to four on 2026-07-28: qwen3:32b, qwen3-coder:30b,
  # devstral:24b, qwen3.5:latest. Everything below reflects that -- ignore
  # any surviving qwen3:8b/bare-devstral reference elsewhere in this repo's
  # history as pre-pruning. Sizes and chat capability now come from the
  # daemon's own /api/show at runtime (harness/gates/router.py's
  # model_params_b/model_chat_capable), not from these names -- see
  # HANDOFF.md §2.9 for why the name alone stopped being trustworthy the
  # moment the catalog grew past three known models.
  default: devstral:24b   # unmatched requests: measured most reliable of the four, not cheapest
  # Phase 3 ScoringModelSelector weights. Higher wins a tie on match count.
  # The rule matching earliest in the text also gets a 2x lead multiplier,
  # because the leading verb is the intent and the rest is the object.
  weights:
    debug: 3.0
    plan: 2.0
    analyze: 1.8
    deploy: 1.5
    code: 1.5
    quick: 0.5
  rules:
    # List order here is not significant to the real router -- every rule is
    # scored (weight x match count, earliest match gets the 2x lead
    # multiplier above), so "the deploy is broken" still routes to debug
    # over deploy on weight, not on being listed first.
    - name: debug
      pattern: '\b(debug|traceback|stack\s*trace|crash|crashing|why\s+(is|does|did)|root\s*cause|failing|broken|bug)\b'
      model: qwen3:32b
      reason: debugging needs the deepest reasoning budget available locally
    - name: deploy
      pattern: '\b(deploy|release|ship|rollout|provision|terraform|ansible|systemd\s+unit)\b'
      model: devstral:24b
      reason: deployment work needs strong tool and file editing behavior
    - name: code
      pattern: '\b(refactor|implement|write\s+(a\s+)?(script|function|class)|patch|migrate\s+code)\b'
      model: qwen3-coder:30b
      reason: code generation is qwen3-coder's namesake specialty (not yet benchmarked against this harness)
    - name: plan
      pattern: '\b(plan|architect|design|strategy|trade[- ]?off|evaluate\s+options)\b'
      model: qwen3:32b
      reason: planning benefits from long context reasoning
    - name: analyze
      pattern: '\b(analy[sz]e|summar[iy]|review|audit|explain)\b'
      model: qwen3:32b
      reason: analysis is reasoning bound, not tool bound
    - name: quick
      pattern: '\b(list|show|print|cat|what\s+is|check|status)\b'
      model: qwen3.5:latest
      reason: trivial lookups do not justify loading a 20b+ model
